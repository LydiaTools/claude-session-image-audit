[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-session-image-audit"
version = "0.1.0"
description = "Read-only audit of embedded image payloads in local Claude Code session logs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "LydiaTools" }]
keywords = ["claude-code", "jsonl", "session", "image", "audit", "context"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
claude-session-image-audit = "claude_session_image_audit.cli:main"

[tool.setuptools.packages.find]
include = ["claude_session_image_audit*"]
